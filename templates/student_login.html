<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6366F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QueueX">
<title>Student Login — QueueX</title>
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="icon" href="{{ url_for('static', filename='img/icon.svg') }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="navbar">
  <a href="{{ url_for('index') }}" class="logo">Queue<span class="dot">X</span></a>
</div>

<div class="container-narrow">
  <div class="card login-card">
    <span class="badge-role">STUDENT ACCESS</span>
    <h2 style="margin-top:14px;">Student Login</h2>
    <p class="sub">Login to track your tokens and history</p>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <label>Email or Roll Number</label>
      <input type="text" name="identifier" placeholder="you@college.edu or roll no" required>

      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:24px;">Login</button>
    </form>

    <p class="footer-note">
      Don't have an account? <a href="{{ url_for('register') }}">Register here</a><br>
      Or continue as <a href="{{ url_for('student') }}">Guest</a>
    </p>
  </div>
</div>
<script src="{{ url_for('static', filename='js/pwa.js') }}"></script>
</body>
</html>
