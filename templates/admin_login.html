<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6366F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QueueX">
<title>Admin Login — QueueX</title>
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="icon" href="{{ url_for('static', filename='img/icon.svg') }}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/icon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="navbar">
  <a href="{{ url_for('index') }}" class="logo">Queue<span class="dot">X</span></a>
</div>

<div class="container-narrow">
  <div class="card login-card">
    <span class="badge-role">SUPER ADMIN ACCESS</span>
    <h2 style="margin-top:14px;">Admin Login</h2>
    <p class="sub">View analytics across all counters</p>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <label>Username</label>
      <input type="text" name="username" placeholder="superadmin" required>

      <label>Password</label>
      <input type="password" name="password" placeholder="super123" required>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:24px;">Login</button>
    </form>

    <p class="footer-note">Demo — username: superadmin, password: super123<br>(For demonstration only.)</p>
  </div>
</div>
<script src="{{ url_for('static', filename='js/pwa.js') }}"></script>
</body>
</html>
