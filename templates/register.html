{% extends "base.html" %}
{% block title %}Student Registration – QueueX{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 2.5rem auto; padding: 0 1.5rem;">
  <div class="neu-card" style="padding: 2.5rem 2rem;">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2 style="font-size: 1.6rem; font-weight: 800; color: var(--qx-navy);">Student Registration</h2>
      <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">Create your QueueX account for CGC University queues</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
      
      <div class="form-group">
        <label class="form-label">Full Name *</label>
        <input type="text" name="full_name" class="neu-input" placeholder="e.g. Navjot Kaur" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label class="form-label">Roll Number *</label>
          <input type="text" name="roll_no" class="neu-input" placeholder="e.g. 2201089" required>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" name="phone" class="neu-input" placeholder="e.g. 9876543210">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address *</label>
        <input type="email" name="email" class="neu-input" placeholder="student@cgc.edu.in" required>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
        <div class="form-group">
          <label class="form-label">Password *</label>
          <input type="password" name="password" class="neu-input" placeholder="Min 6 chars" required>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password *</label>
          <input type="password" name="confirm_password" class="neu-input" placeholder="Re-enter password" required>
        </div>
      </div>

      <button type="submit" class="neu-btn neu-btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 1rem;">
        Complete Registration
      </button>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-secondary);">
        Already registered? <a href="{{ url_for('login', role='student') }}" style="color: var(--qx-blue); font-weight: 700;">Sign in here</a>
      </div>

    </form>

  </div>
</div>
{% endblock %}
