{% extends "base.html" %}
{% block title %}Sign In – QueueX{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 3rem auto; padding: 0 1.5rem;">
  <div class="neu-card" style="padding: 2.5rem 2rem;">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-logo" style="margin: 0 auto 1rem; width: 54px; height: 54px; font-size: 1.4rem;">QX</div>
      <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--qx-navy);">QueueX Portal</h2>
      <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">{{ org['org_name'] }} • Digital Queue Access</p>
    </div>

    <!-- Role Tabs -->
    <div style="display: flex; gap: 0.5rem; background: var(--bg-main); box-shadow: var(--neu-pressed); padding: 0.35rem; border-radius: var(--radius-sm); margin-bottom: 1.5rem;">
      <button type="button" class="neu-btn {% if role == 'student' %}neu-btn-primary{% endif %}" style="flex: 1; padding: 0.45rem; font-size: 0.85rem;" onclick="setRole('student', this)">User / Customer</button>
      <button type="button" class="neu-btn {% if role == 'operator' %}neu-btn-primary{% endif %}" style="flex: 1; padding: 0.45rem; font-size: 0.85rem;" onclick="setRole('operator', this)">Operator</button>
      <button type="button" class="neu-btn {% if role == 'admin' %}neu-btn-primary{% endif %}" style="flex: 1; padding: 0.45rem; font-size: 0.85rem;" onclick="setRole('admin', this)">Admin</button>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
      <input type="hidden" name="role" id="role-input" value="{{ role }}">

      <div class="form-group">
        <label class="form-label" id="id-label">Account ID or Email</label>
        <input type="text" name="login_id" class="neu-input" placeholder="e.g. ID or user@email.com" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="neu-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="neu-btn neu-btn-primary" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem;">
        Sign In to QueueX
      </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-secondary);">
      New to QueueX? <a href="{{ url_for('register') }}" style="color: var(--qx-blue); font-weight: 700;">Create User Account</a>
    </div>

  </div>
</div>

<script>
function setRole(role, btn) {
  document.getElementById('role-input').value = role;
  const label = document.getElementById('id-label');
  if (role === 'student') {
    label.innerText = 'Roll Number or Email';
  } else {
    label.innerText = 'Employee ID or Email';
  }
  const buttons = btn.parentElement.querySelectorAll('button');
  buttons.forEach(b => b.classList.remove('neu-btn-primary'));
  btn.classList.add('neu-btn-primary');
}
</script>
{% endblock %}
